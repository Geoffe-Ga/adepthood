[build-system]
requires = ["setuptools", "wheel"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
known_first_party = ["src", "tests"]
src_paths = ["src", "tests"]

[tool.ruff]
# Both spellings so first-party detection works from the repo root
# (pre-commit) AND from backend/ (scripts/backend/*.sh); ruff ignores
# entries that do not exist for the current cwd.
src = ["backend/src", "src"]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # --- Inapplicable frameworks ---
  "AIR",    # Airflow
  "DJ",     # Django
  "NPY",    # NumPy
  "PD",     # pandas
  "PYI",    # type-stubs-only
  "EXE",    # shebang/executable (not a CLI package)
  "INP",    # no-pep420 implicit namespace packages (FastAPI uses packages)
  "INT",    # gettext (no i18n)
  "CPY",    # copyright headers (not required)
  # --- Justified exceptions ---
  "D100", "D101", "D102", "D103", "D104",
  # Missing docstrings enforced by interrogate (threshold 85%) which
  # gives a project-wide score rather than per-module failures. Enabling
  # these would duplicate that gate with worse UX.
  "TRY003", "EM101", "EM102",
  # Forcing one-off exception classes and extracting string literals from
  # raise statements produces more noise than value in server code. The
  # standard Python pattern (`raise ValueError("descriptive msg")`) is
  # justified. TRY003, EM101, and EM102 all target this same pattern.
  "COM812",
  # Trailing-comma enforcement conflicts with ruff-format, which is the
  # sole formatting authority.
  "ISC001",
  # Implicit string concatenation conflicts with ruff-format.
  "TC001", "TC002", "TC003",
  # Type-checking import guards are incompatible with FastAPI/Pydantic/SQLModel
  # which introspect types at runtime for dependency injection, validation, and
  # ORM mapping. Moving imports into TYPE_CHECKING blocks causes 422 errors.
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert (S101), hardcoded test credentials (S105/S106/S107),
# magic numbers in assertions (PLR2004), boolean positional args in
# parametrize fixtures (FBT001/FBT003), and explicit type-checking imports
# that would be wasteful to guard (TC).
# Patterns include both `tests/` (when run from backend/) and `backend/tests/`
# (when run from repo root by pre-commit).
"tests/**/*.py" = ["S101", "S105", "S106", "S107", "PLR2004", "FBT001", "FBT003"]
"backend/tests/**/*.py" = ["S101", "S105", "S106", "S107", "PLR2004", "FBT001", "FBT003"]
# Script meta-tests shell out to repo-owned scripts with literal argv (S603):
# the shell script *is* the unit under test, so there is no in-process seam to
# drive it through. ruff unions the ignore lists of every matching pattern, so
# this only adds to the tests/** list above. Both spellings again, for the same
# reason.
"tests/scripts/**/*.py" = ["S603"]
"backend/tests/scripts/**/*.py" = ["S603"]
"conftest.py" = ["S101"]
"backend/conftest.py" = ["S101"]
# Issue #272: ``lifespan`` deliberately lazy-imports ``models`` (one-time
# SQLModel metadata registration; unused-name F401 is the point) and
# ``_get_secret_key`` (import-cycle avoidance; PLC0415).  Scoped here so
# the exception is explicit and discoverable instead of inline noqa.
"src/main.py" = ["F401", "PLC0415"]
"backend/src/main.py" = ["F401", "PLC0415"]

[tool.ruff.lint.isort]
# ``conftest`` lives at backend/conftest.py (outside ``src/``) but is
# project-local for import purposes; matching isort's auto-discovery
# keeps the two import-sorters from oscillating on test files.
known-first-party = ["src", "tests", "conftest", "scripts"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
show_error_codes = true
pretty = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
# Same dual spelling as [tool.ruff] src — valid from repo root and backend/.
mypy_path = ["backend/src", "backend", "src", "."]

[tool.pytest.ini_options]
minversion = "7.0"
# Coverage is deliberately NOT in addopts. It used to be, and that made every
# targeted run during Red→Green — `pytest tests/test_foo.py` — instrument all
# 10,910 statements, write coverage.xml, and then FAIL the run against a
# whole-repo 90% gate the single file could never satisfy. A green file exited
# 1 (#2075). The gate itself is unchanged and still enforced, by the three
# invocations that actually gate: `scripts/backend/check-all.sh` (via
# coverage.sh --report-only), the `backend-tests-coverage` pre-push hook, and
# backend-ci.yml. The measured file set stays {src, scripts}, declared once in
# [tool.coverage.run] source below rather than restated per invocation.
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true
markers = [
  "real_license_gate: exercise the real Gumroad signup license gate instead of the default test stub-open fixture",
  "integration: run against a live Postgres 16 whose schema is built by `alembic upgrade head` rather than the SQLite approximation; skipped when TEST_POSTGRES_URL is unset, and hard-failed instead of skipped when INTEGRATION_LANE_REQUIRE_POSTGRES is truthy",
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src", "scripts"]
concurrency = ["greenlet"]
omit = [
  "*/tests/*",
  "*/test_*.py",
  "*/conftest.py",
  "*/migrations/*",
  "*/alembic/*",
  "*/settings.py",
  "*/config.py",
]

[tool.radon]
# Ambient defaults for a bare `radon` run. No threshold lives here on
# purpose: the enforced floors are xenon A/A/A and radon MI rank B or
# better, declared once in scripts/backend/complexity.sh, which passes them
# on the argv where they override anything written here. A `cc_min` or
# `mi_min` key would be read by radon, ignored by every gate, and believed
# by the next person to open this file.
exclude = "migrations,alembic,.venv,venv,tests"
show_complexity = true
average = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

# Docstring coverage — run via `interrogate` or through scripts/backend/.
# Threshold starts permissive and will tighten as existing modules gain
# docstrings (tracked in Tranche 9 of the adepthood-linters integration).
[tool.interrogate]
fail-under = 85
exclude = ["tests", "migrations", "alembic", ".venv", "venv"]
ignore-init-module = true
ignore-init-method = true
ignore-magic = true
ignore-private = true
ignore-semiprivate = true
ignore-nested-functions = true
verbose = 1

# Dead-code detection. Starts at 80% confidence to minimize false positives
# from dynamic dispatch / FastAPI-registered functions; whitelist entries
# should live in .vulture_whitelist.py when added.
[tool.vulture]
paths = ["src"]
min_confidence = 80
exclude = ["tests", "migrations", "alembic", ".venv", "venv"]
sort_by_size = true
