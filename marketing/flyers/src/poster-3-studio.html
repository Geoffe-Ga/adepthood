<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>APTITUDE — It starts with three minutes</title>
<link rel="stylesheet" href="../assets/poster.css">
<style>
  .field { height: 6.9in; }
  h1 { font-size: 78pt; margin-top: 0.5in; }
  .ramp-wrap { margin-top: 0.5in; }
  .ramp { width: 100%; display: block; }
  .cadence {
    font-family: var(--sans); font-size: 9.4pt; font-weight: 700;
    letter-spacing: 0.17em; text-transform: uppercase;
    color: var(--on-umber-mute);
    margin-top: 0.16in; text-align: center;
  }
</style>
</head>
<body>

  <section class="field">
    <div class="wordmark">Aptitude</div>
    <h1>It starts with<br><em>three minutes.</em></h1>

    <div class="ramp-wrap">
      <svg class="ramp" viewBox="0 0 720 150" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 0 132 C 120 132, 240 36, 360 36 L 720 36"
              stroke="#d08558" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="4" cy="132" r="6.4" fill="#d08558"/>
        <circle cx="716" cy="36" r="6.4" fill="#d08558"/>
        <text x="22" y="110" font-family="Inter, sans-serif" font-size="15" font-weight="700"
              fill="#cdbfae" letter-spacing="1.4" paint-order="stroke" stroke="#2a211a"
              stroke-width="6" stroke-linejoin="round">1–3 MIN A DAY</text>
        <text x="700" y="26" text-anchor="end" font-family="Inter, sans-serif" font-size="15"
              font-weight="700" fill="#cdbfae" letter-spacing="1.4" paint-order="stroke"
              stroke="#2a211a" stroke-width="6" stroke-linejoin="round">45 MIN A DAY</text>
      </svg>
      <div class="cadence">Ten stages · thirty-six weeks</div>
    </div>
  </section>

  <section class="foot">
    <p class="support">
      A practice that <strong>steps up only every three weeks</strong> — so you
      are never asked for more than the next small increment.
    </p>

    <div class="getin">
      <div class="qr"><img src="../assets/qr-poster-studio.svg" alt="QR code linking to aptitude.guru"></div>
      <div>
        <div class="scan">Scan, or visit</div>
        <div class="url">aptitude.guru</div>
        <p class="terms">Gift economy — pay what you can. Practice lengths as stated in the course.</p>
      </div>
    </div>
  </section>

</body>
</html>
