# Vendored course content under backend/content/ is managed solely by
# scripts/sync_content.py and pinned by a sha256 digest in CONTENT_VERSION.
# No hook may read or (especially) rewrite it — a whitespace/eol fix would make
# the digest drift in CI. Exempt the whole tree from every hook, like node_modules.
exclude: ^backend/content/

# Which git hooks a bare ``pre-commit install`` writes. Declared here rather than
# left to the caller's flags because the omission was invisible and cost real
# time: the three ``stages: [pre-push]`` hooks below -- the whole expensive local
# gate -- had never fired on anybody's machine, because ``dev-setup.sh`` installed
# only ``pre-commit`` and ``commit-msg`` and nothing supplied ``--hook-type
# pre-push``. CI ran them regardless, so nothing shipped unverified, but four
# documents described a push-time gate that did not exist, and every coverage or
# complexity regression surfaced ~18 minutes into CI instead of ~5 minutes
# locally. Naming the set here means a future install cannot silently drop one.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-docstring-first
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=250"]
        exclude: |
          (?x)(
            ^frontend/package-lock\.json$
            |^backend/content/
            # Generated from the app's own routes and schemas (~424KB for 96
            # paths / 160 components) and held current by the openapi-drift CI
            # job. Excluded rather than raising --maxkb, which would weaken the
            # guard for every file; this hook exists to catch an accidental
            # binary, and this is a deliberate, reviewed, gated artifact.
            |^backend/openapi\.json$
          )
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  # Python format / lint / type-check
  # ruff-format is the single source of truth for Python formatting;
  # ruff --fix handles lint auto-fixes. Black was removed to eliminate
  # redundant/conflicting formatters.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.9
    hooks:
      - id: ruff
        files: ^backend/
        args: ["--config=backend/pyproject.toml", "--fix"]
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        files: ^backend/
        exclude: ^backend/migrations/
        args: ["--config-file=backend/pyproject.toml"]
        additional_dependencies: ["types-jsonschema==4.26.0.20260518", "types-cachetools==7.0.0.20260713", "types-requests==2.33.0.20260712", "openai==2.53.0", "anthropic==0.120.2", "pydantic==2.13.4", "sqlmodel==0.0.39", "fastapi==0.141.1", "starlette==1.4.1", "pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1", "aiosqlite==0.22.1", "PyJWT==2.13.0", "bcrypt==5.0.0", "cryptography==50.0.0", "slowapi==0.1.10", "limits==5.8.0", "alembic==1.19.0", "uvicorn==0.52.1"]

  - repo: https://github.com/PyCQA/isort
    rev: 6.0.1
    hooks:
      - id: isort
        files: ^backend/
        args: ["--settings-path=backend/pyproject.toml"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        files: ^backend/
        args: ["-c", "backend/.bandit", "-r", "backend"]

  - repo: https://github.com/trailofbits/pip-audit
    rev: v2.9.0
    hooks:
      - id: pip-audit
        name: pip-audit (backend dependencies)
        files: ^backend/
        # PYSEC-2025-183: disputed pyjwt advisory published 2026-05-20 with no
        # fixed release (2.12.1 is the latest). Ignored as an unfixable,
        # disputed finding; revisit when upstream ships a patched version.
        args:
          ["-r", "backend/requirements.txt", "--ignore-vuln", "PYSEC-2025-183"]
      - id: pip-audit
        name: pip-audit (graph tooling dependencies)
        files: ^scripts/graph/requirements\.txt$
        args: ["-r", "scripts/graph/requirements.txt"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # backend/content/ is vendored course content (managed only by
        # sync_content.py and pinned by digest in CONTENT_VERSION); scanning
        # published Markdown for secrets is pure noise, like node_modules.
        exclude: ^backend/content/

  # Frontend (React Native) checks using local hooks (requires Node in the environment).
  # `bash -c` is used (not `bash -lc`) so hooks do not depend on interactive shell
  # profiles (.bashrc/.bash_profile), which keeps CI environments reproducible.
  - repo: local
    hooks:
      - id: frontend-eslint
        name: frontend eslint
        language: system
        entry: bash -c 'cd frontend && npm run lint'
        pass_filenames: false
        files: ^frontend/
        exclude: ^frontend/(?:node_modules|dist|build|coverage)/

      - id: frontend-prettier
        name: frontend prettier (write)
        entry: bash -c 'cd frontend && npx prettier --write .'
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx|json|css|md|ya?ml)$
        exclude: ^frontend/(?:node_modules|dist|build|coverage)/|^frontend/(?:tsconfig\.json|package-lock\.json)$

      - id: frontend-typecheck
        name: frontend typecheck
        entry: bash -c 'cd frontend && npx tsc -p tsconfig.json --noEmit'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$
        exclude: ^frontend/(?:node_modules|dist|build|coverage)/

      - id: frontend-tests
        name: frontend tests
        entry: bash -c 'cd frontend && npx jest --passWithNoTests'
        language: system
        pass_filenames: false
        files: ^frontend/
        exclude: ^frontend/(?:node_modules|dist|build|coverage)/
        # Fast (no-coverage) run for pre-commit only; pre-push runs the
        # coverage-enforcing `frontend-tests-coverage` hook instead, so Jest
        # is not executed twice on push.
        stages: [pre-commit]

      # Expensive hooks run on pre-push only. This keeps `git commit` under
      # ~10s while still gating pushes on the full quality suite.
      # Delegates to the script rather than restating the thresholds, so the
      # hook and `check-all.sh` can never gate at different grades again.
      - id: backend-complexity
        name: backend complexity gate (xenon + radon)
        entry: bash -c '[ -f .venv/bin/activate ] && source .venv/bin/activate; ./scripts/backend/complexity.sh'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
        stages: [pre-push]

      - id: backend-tests-coverage
        name: backend tests (coverage required)
        language: system
        # Routed through test.sh rather than calling pytest directly, because
        # that script takes .gate-state/locks/backend-suite.lock first. A push
        # firing while check-all.sh is mid-run otherwise gives two whole-suite
        # runs sharing one coverage data file, one set of SQLite fixtures, and
        # the cores ``-n auto`` sized for a single process -- and the damage is
        # a wrong number rather than a crash, so nothing announces it.
        #
        # ``--all --coverage`` is the same run this line used to spell out:
        # distributed (``-n "$PYTEST_WORKERS" --dist loadfile``), bare ``--cov``
        # so the measured set stays the single [tool.coverage.run] declaration
        # (= {src, scripts}) that backend-ci.yml's branch-coverage step asserts
        # over, and ``--cov-fail-under=90``.
        entry: bash -c '[ -f .venv/bin/activate ] && source .venv/bin/activate; ./scripts/backend/test.sh --all --coverage'
        pass_filenames: false
        files: ^backend/
        stages: [pre-push]

      - id: frontend-tests-coverage
        name: frontend tests (coverage required)
        language: system
        entry: bash -c 'cd frontend && npx jest --coverage --passWithNoTests'
        pass_filenames: false
        files: ^frontend/
        exclude: ^frontend/(?:node_modules|dist|build|coverage)/
        stages: [pre-push]

      - id: commitlint
        name: commitlint (conventional commits)
        language: system
        entry: bash -c 'cd frontend && npx commitlint --extends @commitlint/config-conventional --edit "$1"'
        stages: [commit-msg]
        # IMPORTANT: commit-msg hooks receive the commit message path as $1
        # so do NOT set pass_filenames: false here.
