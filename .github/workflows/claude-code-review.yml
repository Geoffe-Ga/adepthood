name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

# A full agent review is the most expensive thing this repo runs. Without a
# concurrency group, every ``synchronize`` started another one and left the
# previous review grinding against a superseded SHA — then posted its verdict
# on the PR, where address-feedback could act on a comment describing code
# that no longer exists (#2077). Newest push wins.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip runs Dependabot itself triggered: GitHub withholds Actions secrets
    # (incl. CLAUDE_CODE_OAUTH_TOKEN) from a run whose ACTOR is Dependabot, so
    # the action would hard-fail before reviewing and block the PR's check. That
    # withholding is keyed to the actor, not to who opened the PR — and the PR's
    # author stays `dependabot[bot]` forever, so keying the skip there suppressed
    # the review permanently on bot PRs we had already pushed to, the very runs
    # where the secrets ARE available. Once one of our commits lands on the
    # branch, the synchronize run is ours and the bump gets a real review.
    if: github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@c038e4dcdedfbbca18dfb17df35a17e40ded4ddc  # v1.0.186
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "dependabot[bot]"
          prompt:  |
            Review pull request #${{ github.event.pull_request.number }} in the
            repository ${{ github.repository }}, against that repository's
            CLAUDE.md. Read the change with

                gh pr diff ${{ github.event.pull_request.number }}
                gh pr view ${{ github.event.pull_request.number }}

            and any files you need.

            Always pass that number explicitly. A bare `gh pr diff` resolves only
            when the checkout is on a recognizable PR branch; here it is a merge
            ref, so the bare form fails and any recovery that guesses -- listing
            open PRs and taking the newest, say -- silently reviews somebody
            else's change. The "Post review" step below attaches whatever you
            return to #${{ github.event.pull_request.number }} regardless, so a
            guess becomes a verdict on a PR you never read.

            Do NOT post a comment yourself. Return ONLY the structured result with
            four fields:

            - "reviewed_pr_number": the number of the PR you actually read, as an
              integer. This is checked against the PR being posted to and a
              mismatch fails the run, so report what you read rather than what
              you were asked to read.

            - "review_markdown": the full review as GitHub markdown, using this
              template (omit the verdict here — it is a separate field below):

              ## Summary
              Brief overview (2-3 sentences)
              ## Strengths
              What's done well?
              ## Security Concerns
              Vulnerabilities? 🔴 BLOCKING | 🟡 HIGH | 🟢 LOW
              ## Problems
              Critical issues blocking merge (mark 🔴)
              ## Code Quality
              Non-blocking improvements (these are COMMENTS, not blockers)
              ## CLAUDE.md Adherence
              ✅/❌ Coverage, linting, types, patterns, commits
              ## Testing
              Test quality (insufficient testing is BLOCKING)
              ## Documentation
              Docs completeness

            - "verdict": exactly one of CHANGES_REQUESTED, COMMENTS, LGTM. Take a
              clear stance — do NOT default to COMMENTS as a safe middle ground.
              Reason about it like this:

                1. Is there ANY blocking problem? A real bug, a 🔴 security issue,
                   insufficient/missing tests, or a CLAUDE.md violation that must
                   be fixed before merge → CHANGES_REQUESTED.
                2. Otherwise, would you merge this as-is right now? If the only
                   remarks are nits you would not block on (or there is nothing to
                   note), say so → LGTM. Minor style nits do NOT downgrade an
                   otherwise-mergeable PR.
                3. Reserve COMMENTS for the genuine middle: nothing blocks merge,
                   but there ARE substantive non-blocking suggestions the author
                   should weigh first. If you reach for COMMENTS, name the specific
                   suggestion that keeps it out of LGTM — if you can't, it's LGTM.

            - "verdict_rationale": one or two sentences justifying the verdict,
              required for ALL THREE outcomes. For CHANGES_REQUESTED, name the
              blocking issue(s). For COMMENTS, name the substantive suggestion(s)
              that kept it from LGTM. For LGTM, state why it is ready to merge.

          # The --json-schema flag makes the action return a validated
          # ``structured_output`` JSON string (verdict + rationale +
          # review_markdown) instead of relying on the agent to remember to post a
          # comment — the "Post review" step below then posts it deterministically
          # (fixes the flaky success-with-no-comment runs, #810). gh pr comment is
          # intentionally NOT in allowed-tools so the agent cannot post on its own.
          claude_args: >-
            --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","verdict_rationale","review_markdown","reviewed_pr_number"],"properties":{"verdict":{"type":"string","enum":["CHANGES_REQUESTED","COMMENTS","LGTM"]},"verdict_rationale":{"type":"string"},"review_markdown":{"type":"string"},"reviewed_pr_number":{"type":"integer"}}}'
            --allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Post review
        # Deterministic: this step always runs after a successful review and posts
        # the comment. If the action produced no structured output (a genuinely
        # failed/empty review), fail so the check is red and the review is
        # re-run — never a silent success with no review (#810).
        env:
          # Prefer GEOFFE_GA_PAT (a real PAT with pull-requests:write, the same
          # one iteration-trigger uses) so the verdict comment is authored by a
          # real account the mobile webhook recognizes; fall back to GITHUB_TOKEN
          # (github-actions[bot]) if the PAT secret is absent. NOT the action's
          # Claude App github_token output — that 401s with gh (#839/#843).
          GH_TOKEN: ${{ secrets.GEOFFE_GA_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          STRUCTURED: ${{ steps.claude-review.outputs.structured_output }}
        run: |
          set -euo pipefail
          if [ -z "${STRUCTURED:-}" ]; then
            # claude-code-action self-skips (anti-tamper) on any PR that edits this
            # workflow file, so there is no review to post — that is expected and
            # must not fail the check (the workflow change is reviewed manually).
            if gh pr diff "$PR_NUMBER" -R "$REPO" --name-only \
                 | grep -qx '.github/workflows/claude-code-review.yml'; then
              echo "::warning::This PR edits the review workflow, so the action self-skips — no automated verdict; review manually."
              exit 0
            fi
            echo "::error::Claude review produced no structured output — failing so it is re-run, never a silent no-review."
            exit 1
          fi
          # Refuse to post a review of a different PR. The agent resolves the PR
          # itself, so a failed `gh pr diff` plus a guessing recovery can produce
          # a complete, plausible review of somebody else's change -- which this
          # step would otherwise attach here with full confidence. That happened:
          # #2211's review landed on #2210. The dangerous direction is a
          # misrouted LGTM, since pr-ready.sh treats it as the merge criterion
          # and nothing downstream re-reads the body. Fail loudly instead.
          reviewed=$(jq -r '.reviewed_pr_number // empty' <<<"$STRUCTURED")
          if [ "$reviewed" != "$PR_NUMBER" ]; then
            echo "::error::Review reports PR #${reviewed:-<missing>} but this run is for PR #$PR_NUMBER — refusing to post a review of a different change."
            exit 1
          fi
          verdict=$(jq -r '.verdict' <<<"$STRUCTURED")
          rationale=$(jq -r '.verdict_rationale // ""' <<<"$STRUCTURED")
          jq -r '.review_markdown' <<<"$STRUCTURED" > review.md
          # Keep the "## Verdict: <verdict>" line exactly — downstream skills
          # (address-feedback, await-claude-review) parse it. The rationale goes
          # on the following line so the verdict is never ambiguous.
          printf '\n\n## Verdict: %s\n' "$verdict" >> review.md
          if [ -n "$rationale" ]; then
            printf '\n%s\n' "$rationale" >> review.md
          fi
          gh pr comment "$PR_NUMBER" -R "$REPO" --body-file review.md
          echo "Posted review with verdict: ${verdict}"
