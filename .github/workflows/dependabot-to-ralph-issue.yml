name: Dependabot → Ralph Issue Bridge

# Bridges Dependabot's PR-only model into Ralph's issue-first loop. Dependabot
# produces PRs with no GitHub issue and no `Closes #N` line, so they are
# invisible to `scripts/ralph/pick-next.sh` and rot. This workflow, for each
# open Dependabot PR, (a) files a Ralph-qualified `dependencies` issue and
# (b) appends `Closes #<issue>` to the Dependabot PR body — turning the
# Dependabot PR into Ralph's in-flight PR (Mode B), so Ralph adopts it through
# its existing path with no duplicate PR. See issue tracker for full design.
#
# Two triggers, one idempotent reconciler:
#   - pull_request_target (dependabot-only): real-time, links a PR as it opens.
#   - workflow_dispatch + schedule: backfill / safety net; clears the existing
#     backlog, re-links any PR whose body Dependabot later overwrites, and closes
#     bridge issues whose PR is gone (a superseded PR closes unmerged, so its
#     `Closes` never fires and the issue would rot as a stale adoption ticket).
#
# SECURITY — pull_request_target runs with the base-repo token (it has
# issues:write / pull-requests:write, which a dependabot-triggered
# `pull_request` run does not). To stay safe we NEVER check out the PR head and
# NEVER inline untrusted `${{ }}` event fields in a `run:` block — the PR title
# is passed via an env var so a crafted branch/title cannot inject shell.

on:
  # Real-time: a Dependabot PR opens or reopens. pull_request_target so the run
  # has the base-repo token (issues:write / pull-requests:write). Gated to
  # Dependabot only below.
  pull_request_target:
    types: [opened, reopened]
  # Backfill + safety net: clears the existing Dependabot backlog on first
  # dispatch and re-links any PR whose body was overwritten. Scheduled a few
  # hours after Dependabot's weekly Monday window so freshly-opened PRs exist.
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

# Limit the token to exactly what the bridge needs: file issues, edit PR
# bodies, read repo metadata. No contents:write — we never push code.
permissions:
  issues: write
  pull-requests: write
  contents: read

# Serialize runs so the event-driven and scheduled paths can never race and
# double-file for the same PR.
concurrency:
  group: dependabot-to-ralph-issue
  cancel-in-progress: false

jobs:
  bridge:
    name: File Ralph issues for Dependabot PRs and link them
    runs-on: ubuntu-latest
    # On pull_request_target, only act for Dependabot's own PRs. The scheduled
    # and manual triggers have no actor PR context, so let them through.
    if: >-
      github.event_name != 'pull_request_target' ||
      github.actor == 'dependabot[bot]'
    steps:
      - name: Check out base-branch scripts (never the PR head)
        # LOAD-BEARING, not just a clean workspace: this checkout supplies the
        # copy of scripts/ralph/ensure-issue-label.sh that the run: block below
        # executes. Under pull_request_target the default ref is the BASE
        # branch, so that code is trusted. NEVER add a `ref:` pointing at the PR
        # head — this job holds a write-capable token, so running head code
        # would be arbitrary code execution by any PR author.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          # The job runs no git commands, so the token has no reason to be
          # persisted into .git/config where later steps could reuse it.
          persist-credentials: false

      - name: Bridge Dependabot PRs into Ralph issues
        env:
          # Prefer a real PAT (same convention as claude-code-review.yml and
          # deslop.yml) so the issue/PR edits are authored by an account
          # the mobile webhook recognizes; fall back to the run's GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.GEOFFE_GA_PAT || secrets.GITHUB_TOKEN }}
          # Second credential for the label call only. This ADDS NO PERMISSION:
          # it is the run's own token, which the permissions: block above already
          # grants issues: write. It exists because GH_TOKEN prefers the PAT, and
          # the PAT is the credential observed to be denied label writes.
          FALLBACK_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          # Event-driven PR metadata, read ONLY from the trusted event payload.
          # The title is passed as an env var (never inlined into a run: block)
          # to foreclose script injection from a crafted branch/PR title.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # Marker linking an issue back to its Dependabot PR. Hidden HTML
          # comment in the issue body; the dedup check greps for it so re-runs
          # never double-file.
          marker_for() { printf '<!-- dependabot-pr:%s -->' "$1"; }

          # The inverse of marker_for: recover the PR number from an issue body,
          # empty when the body carries no marker. Builds its pattern FROM
          # marker_for so the marker's shape stays defined in exactly one place.
          pr_from_marker() {
            local pattern
            pattern="$(marker_for '\([0-9][0-9]*\)')"
            printf '%s' "$1" | sed -n "s/.*$pattern.*/\1/p" | head -n 1
          }

          # True if a PR body already links an issue via Closes/Fixes/Resolves.
          body_links_issue() {
            printf '%s' "$1" | grep -qiE '(closes|fixes|resolves)[[:space:]]+#[0-9]+'
          }

          # True if an open `dependencies` issue already carries this PR's
          # marker. Idempotency keystone: a second run finds the marker and
          # files nothing.
          issue_exists_for_pr() {
            local pr="$1" marker
            marker="$(marker_for "$pr")"
            gh issue list --repo "$REPO" --label dependencies --state open \
              --limit 200 --json number,body \
              --jq '.[].body' 2>/dev/null | grep -qF "$marker"
          }

          # The working contract, stated verbatim, with a `{PR}` placeholder.
          # Kept on one source line so it stays indented inside the YAML block
          # scalar (a heredoc at column 1 would terminate the scalar).
          contract='Adopt Dependabot PR #{PR} (its branch is already linked via `Closes`). Rebase on `main`, run the relevant `./scripts/<side>/check-all.sh`. **Upgrade fully — if the new major requires code changes, make them** (TDD the adaptation per `stay-green`; no pins-back, no `# type: ignore`, no weakening a gate). Push fixes **to the Dependabot branch**, drive CI + the Claude review to green, squash-merge. Merging closes this issue.'

          # File a Ralph-ready `dependencies` issue for one PR and append
          # `Closes #<issue>` to that PR's body. No-op if already linked.
          bridge_pr() {
            local pr="$1" title="$2" pr_body issue_body issue_num marker
            marker="$(marker_for "$pr")"

            pr_body="$(gh pr view "$pr" --repo "$REPO" --json body --jq .body)"

            # Skip PRs that already link an issue (Dependabot rarely does, but
            # a prior bridge run may have).
            if body_links_issue "$pr_body"; then
              echo "PR #$pr already links an issue — skipping."
              return 0
            fi

            # Dedup against an existing open issue carrying this PR's marker.
            if issue_exists_for_pr "$pr"; then
              echo "Issue already exists for PR #$pr (marker present) — skipping."
              return 0
            fi

            # Build the Ralph-ready issue body: hidden marker, the verbatim
            # contract (with {PR} substituted), and a link to the Dependabot PR.
            local contract_body="${contract//\{PR\}/$pr}"
            issue_body="$(printf '%s\n\n%s\n\nDependabot PR: #%s\n' \
              "$marker" "$contract_body" "$pr")"

            # Title mirrors the Dependabot PR so the dep/from/to is legible.
            # Labels: `dependencies` only — none of pick-next.sh's exclude set,
            # so the picker treats it as a normal candidate.
            issue_num="$(gh issue create --repo "$REPO" \
              --title "chore(deps): adopt Dependabot PR #$pr — $title" \
              --label dependencies \
              --body "$issue_body" \
              | grep -oE '[0-9]+$')"

            echo "Filed issue #$issue_num for PR #$pr."

            # Append `Closes #<issue>` so the Dependabot PR becomes Ralph's
            # in-flight PR and auto-closes the issue on merge into main. Do this
            # BEFORE the label check below so that a persistent permission gap
            # surfaces the error once instead of minting a fresh orphaned issue
            # on every trigger: once the PR body links the issue,
            # `body_links_issue` (which reads the PR body, not the label)
            # short-circuits all subsequent runs.
            gh pr edit "$pr" --repo "$REPO" \
              --body "$(printf '%s\n\nCloses #%s' "$pr_body" "$issue_num")"

            echo "Linked PR #$pr → issue #$issue_num via Closes."

            # Re-apply the `dependencies` label and prove it stuck: the marker
            # dedup above filters on that label, so an unlabeled issue is also a
            # picker-invisible one. Delegated to a script because the obvious
            # call, `gh issue edit --add-label`, performs the GraphQL mutation
            # addLabelsToLabelable, which the PAT in GH_TOKEN is observed to be
            # denied; the `issues: write` declared above governs the run's
            # GITHUB_TOKEN, which that call never used. The script POSTs to the
            # REST labels endpoint (needs only issues:write, and errors instead
            # of dropping), retries once with FALLBACK_GH_TOKEN, verifies by
            # read-back, and prints the verbatim gh stderr of every failure —
            # the old `|| true` discarded exactly that answer, leaving the
            # diagnosis below to guess, and it guessed wrong. A re-run cannot
            # re-reach this point (the PR body now links the issue, so
            # `body_links_issue` short-circuits), so the script's diagnosis
            # names the one-time manual fix.
            local label_output="" label_error="" label_ec=0
            label_output="$(scripts/ralph/ensure-issue-label.sh \
              "$issue_num" dependencies --repo "$REPO" 2>&1)" || label_ec=$?
            # Even on success the output may carry a ::warning:: about a token
            # whose gap the fallback papered over — always surface it.
            echo "$label_output"

            # Failure is the EXIT CODE, never output emptiness: a non-zero exit
            # that printed nothing (killed by a signal, say) is precisely the
            # failure class the old `|| true` hid.
            #
            # Handling then differs by path. The single-PR event path fails loud
            # and immediate (exit 1). The reconciler processes a whole batch, so
            # one PR's label-verify failure must NOT skip every later PR: record
            # the diagnosis and let the caller continue, then fail the run once
            # at the end. The issue is filed and its PR is already linked, so
            # `body_links_issue` short-circuits any re-run — no duplicate is
            # ever minted while the label is added by hand.
            if [ "$label_ec" -ne 0 ]; then
              # Actions renders only the FIRST line of an `::error::` as an
              # annotation; every later line falls through as plain log text. So
              # the annotation is a synthesized one-liner and the verbatim gh
              # stderr stays where `echo "$label_output"` already put it in full
              # — feeding the whole block in here would render one line in the UI
              # and dribble the remainder out as a second, half-rendered copy of
              # what is already logged. Pointing at the log keeps the diagnostic
              # fidelity that is this call's whole purpose. Synthesized
              # unconditionally, so there is no empty payload left to guard.
              label_error="ensure-issue-label.sh exited $label_ec; the 'dependencies' label on issue #$issue_num is unverified — see the verbatim gh output logged above."
              if [ "$EVENT_NAME" = "pull_request_target" ]; then
                echo "::error::$label_error" >&2
                exit 1
              fi
              reconcile_failures+=("$label_error")
              echo "Label-verify failed for issue #$issue_num — recorded; continuing the batch." >&2
            fi
          }

          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            # Real-time path: bridge just this one PR. Title comes from the env
            # var, never inlined into the command.
            echo "Event-driven: bridging Dependabot PR #$PR_NUMBER."
            bridge_pr "$PR_NUMBER" "$PR_TITLE"
            exit 0
          fi

          # Reconciler path (schedule / manual): bridge every open Dependabot
          # PR that is not yet linked. Idempotent — a re-run files/edits nothing.
          echo "Reconciler: scanning open Dependabot PRs."
          prs="$(gh pr list --repo "$REPO" --state open --author 'app/dependabot' \
            --limit 200 --json number,title,body,headRefName)"

          count="$(printf '%s' "$prs" | jq 'length')"
          echo "Found $count open Dependabot PR(s)."

          # Collects label-verify diagnoses across the batch so one PR's
          # failure never skips the rest; the run fails once at the end if any
          # were recorded.
          reconcile_failures=()

          # Iterate without piping into a subshell so set -e propagates.
          for i in $(seq 0 $((count - 1))); do
            num="$(printf '%s' "$prs" | jq -r ".[$i].number")"
            ttl="$(printf '%s' "$prs" | jq -r ".[$i].title")"
            body="$(printf '%s' "$prs" | jq -r ".[$i].body")"
            if body_links_issue "$body"; then
              echo "PR #$num already links an issue — skipping."
              continue
            fi
            bridge_pr "$num" "$ttl"
          done

          # Close orphaned bridge issues. A Dependabot PR that is superseded by a
          # newer grouped PR closes WITHOUT merging, so its `Closes #N` never
          # fires and the issue stays open forever — and pick-next.sh's in-flight
          # scan only sees OPEN PRs, so the next Ralph tick would hand that issue
          # to a worker who builds it on a brand-new branch and opens a second PR.
          echo "Reconciler: closing bridge issues whose PR is closed or merged."
          bridged="$(gh issue list --repo "$REPO" --label dependencies --state open \
            --limit 200 --json number,body)"
          bridged_count="$(printf '%s' "$bridged" | jq 'length')"
          echo "Found $bridged_count open dependencies issue(s)."

          for i in $(seq 0 $((bridged_count - 1))); do
            inum="$(printf '%s' "$bridged" | jq -r ".[$i].number")"
            ibody="$(printf '%s' "$bridged" | jq -r ".[$i].body")"
            # No marker ⇒ not a bridge issue ⇒ none of this job's business.
            linked_pr="$(pr_from_marker "$ibody")"
            if [ -z "$linked_pr" ]; then
              continue
            fi
            linked_state="$(gh pr view "$linked_pr" --repo "$REPO" \
              --json state --jq .state 2>/dev/null || true)"
            # An OPEN PR is the healthy in-flight case; an unreadable state (PR
            # deleted, transient API error) is left alone rather than guessed at.
            if [ "$linked_state" != "CLOSED" ] && [ "$linked_state" != "MERGED" ]; then
              continue
            fi
            # A superseded PR was never planned to land; a merged one completed.
            if [ "$linked_state" = "MERGED" ]; then
              close_reason="completed"
            else
              close_reason="not planned"
            fi
            # Same convention as the label failures above: record and continue, so
            # one un-closable issue never skips the rest of the batch.
            if gh issue close "$inum" --repo "$REPO" --reason "$close_reason" \
              --comment "Dependabot PR #$linked_pr is $linked_state, so this adoption ticket is obsolete. Closing it so it is not picked up as new work." >/dev/null; then
              echo "Closed orphaned issue #$inum (PR #$linked_pr $linked_state)."
            else
              reconcile_failures+=("could not close orphaned issue #$inum whose PR #$linked_pr is $linked_state")
              echo "Close failed for issue #$inum — recorded; continuing the batch." >&2
            fi
          done

          # Surface every deferred failure at once and fail the run, so the batch
          # completes but a permission gap or persistent API flake is never
          # silently swallowed. Every issue is filed and its PR linked, so the
          # manual steps are only the ones named below.
          if [ "${#reconcile_failures[@]}" -gt 0 ]; then
            echo "::error::${#reconcile_failures[@]} reconciler step(s) need a manual fix — add the missing 'dependencies' label(s) or close the named issue(s) by hand (details below)." >&2
            for failure in "${reconcile_failures[@]}"; do
              echo "::error::$failure" >&2
            done
            exit 1
          fi

          echo "Reconciler complete."
