name: "Scan: Dead code"

# Thin wrapper over the reusable _claude-scan.yml core. vulture + knip/ts-prune: unused exports, unreachable branches, orphaned files, unused deps.
#
# Clone of scan-todo.yml; see it and _claude-scan.yml for the full rationale
# (auth, permissions, SHA-pinned actions, the scan-issue-writer contract).
# workflow_dispatch is REQUIRED on every scan wrapper — it is the hook the
# queue-depth hopper uses to refill the Ralph backlog off-schedule.

on:
  # PAUSED 2026-08-26: automated issue inflow paused by owner request.
  # Re-enable by uncommenting; workflow_dispatch still allows manual runs.
  # schedule:
  # - cron: "0 8 * * 1"       # weekly Monday 08:00 UTC
  workflow_dispatch:
    inputs:
      max_issues:
        description: "Hard cap on issues created this run."
        required: false
        default: "6"

permissions:
  contents: read
  issues: write
  # OIDC token for the claude action's auth exchange. A called reusable
  # workflow cannot hold more than its caller, and `_claude-scan.yml` asks
  # for this -- omitting it here rejects the whole file before any job is
  # created, which is a startup failure with no log to read.
  id-token: write

jobs:
  run:
    uses: ./.github/workflows/_claude-scan.yml
    with:
      scan_name: dead-code
      max_issues: ${{ fromJSON(github.event.inputs.max_issues || '6') }}
      priority: P3
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
