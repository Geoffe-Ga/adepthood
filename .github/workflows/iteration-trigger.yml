name: Iteration Trigger

# Posts a brief executive summary on a PR (commenting as Geoffe-Ga via PAT)
# whenever CI completes fully green AND a Claude review has been posted.
# The comment is intended to fire a webhook that wakes the Claude Code mobile
# app via MCP so it can act on the verdict: iterate on CHANGES_REQUESTED; on
# COMMENTS file each finding as a P0-P3 follow-up issue and merge (never
# iterate); on LGTM merge. Capped at 10 self-posts per PR to avoid runaway loops.
#
# Required secrets:
#   GEOFFE_GA_PAT  - personal access token for Geoffe-Ga with `pull-requests: write`.
#                    Without this the comment would post as github-actions[bot]
#                    and the mobile webhook would not recognize the author.

on:
  workflow_run:
    # Must match the upstream workflows' ``name:`` exactly; the previous value
    # matched no workflow in this repo, so the trigger never fired.
    # "Claude Code Review" is included so the trigger re-fires when the verdict
    # comment lands AFTER both CI workflows have already completed — otherwise
    # the merge clearance would never be evaluated for that ordering.
    workflows: ["Backend CI", "Frontend CI", "Claude Code Review"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  nudge:
    name: Post executive summary
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number from head branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR=$(gh pr list -R "$REPO" --head "$BRANCH" --state open \
                 --json number --jq '.[0].number // empty')
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Compose and post summary
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GEOFFE_GA_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          MARKER: '<!-- iteration-trigger -->'
        run: |
          set -euo pipefail

          # Pull PR comments once (first 100 is plenty for an active PR).
          gh api "repos/$REPO/issues/$PR/comments?per_page=100" > comments.json

          # Cap: stop after 10 prior self-posts on this PR.
          PRIOR=$(grep -c "$MARKER" comments.json || true)
          if [ "$PRIOR" -ge 10 ]; then
            echo "Cap reached ($PRIOR/10) - skipping"
            exit 0
          fi

          # Find the latest Claude review comment via the deterministic
          # "## Verdict: <verdict>" line that claude-code-review.yml appends.
          CLAUDE=$(jq -c '[.[] | select(.body | test("(^|\\n)## Verdict:"))] | last // empty' comments.json)
          if [ -z "$CLAUDE" ]; then
            echo "No Claude review yet - skipping"
            exit 0
          fi
          ID=$(jq -r '.id'   <<<"$CLAUDE")
          BODY=$(jq -r '.body' <<<"$CLAUDE")

          # Parse the verdict from that line only — grepping the whole body is
          # unsafe (a COMMENTS rationale may itself mention "LGTM"). COMMENTS
          # clears a merge, so it must be read off the line explicitly: an
          # unrecognised line is UNPARSED, which clears nothing.
          VLINE=$(grep -m1 -E '^## Verdict:' <<<"$BODY" || true)
          case "$VLINE" in
            *CHANGES_REQUESTED*) VERDICT='CHANGES REQUESTED' ;;
            *LGTM*)              VERDICT='LGTM' ;;
            *COMMENTS*)          VERDICT='COMMENTS' ;;
            *)                   VERDICT='UNPARSED' ;;
          esac

          # CI status from check-runs on the head SHA. Skipped/neutral runs are
          # non-blocking: the Dependabot->Ralph bridge job is skipped on every
          # non-Dependabot PR and would otherwise keep GREEN < TOTAL forever,
          # so the merge clearance below could never fire. In-progress runs
          # (conclusion null) still count in TOTAL, so nothing is cleared while
          # a check is running.
          gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" > runs.json
          TOTAL=$(jq '[.check_runs[] | select(.conclusion != "skipped" and .conclusion != "neutral")] | length' runs.json)
          GREEN=$(jq '[.check_runs[] | select(.conclusion == "success")] | length'                             runs.json)

          # Green + LGTM is not enough to clear a merge. The same two conditions
          # scripts/ralph/pr-ready.sh enforces apply here, or this job would clear
          # the very lanes that helper refuses: one a human put on hold, and one
          # that CONFLICTS with its base. Being BEHIND the base is deliberately
          # not a blocker (owner rule, 2026-10-31): a PR that passed every other
          # gate merges as long as GitHub reports no merge conflict.
          #
          # GitHub computes `mergeable` lazily and answers null until it has, so
          # a null is re-polled a few times and, if still null, reported as "not
          # yet known" - never read as clear. A PR object that cannot be read at
          # all yields no labels and a null `mergeable`, so both checks fail
          # closed; the read's own stderr is left visible in the step log so a
          # transport failure stays distinguishable from a real answer.
          MERGEABLE_POLLS=4
          MERGEABLE_POLL_SECONDS=5
          read_pr() {
            if ! PR_JSON=$(gh api "repos/$REPO/pulls/$PR"); then
              echo "::warning::could not read PR #$PR; hold and mergeability treated as unknown"
              PR_JSON='{}'
            fi
            MERGEABLE=$(jq -r 'if .mergeable == null then "null" else (.mergeable | tostring) end' <<<"$PR_JSON")
            MERGE_STATE=$(jq -r '.mergeable_state // "unknown"' <<<"$PR_JSON")
          }
          read_pr
          POLL=1
          while [ "$MERGEABLE" = "null" ] && [ "$POLL" -lt "$MERGEABLE_POLLS" ]; do
            sleep "$MERGEABLE_POLL_SECONDS"
            read_pr
            POLL=$((POLL + 1))
          done
          BASE=$(jq -r '.base.ref // empty' <<<"$PR_JSON")
          HELD=$(jq -r 'if .labels == null then "unknown"
                        elif ([.labels[].name] | index("do-not-auto-merge")) then "yes"
                        else "no" end' <<<"$PR_JSON")

          # COMMENTS is a sign-off with non-blocking findings: it never asks for
          # another iteration. Its findings become follow-up issues prioritized
          # P0-P3 by severity (address-feedback skill, Step 1A).
          FILE_FOLLOWUPS="Do NOT iterate on this review: pull comment ${ID} and file each actionable finding as a follow-up issue with a P0-P3 label matched to its severity (address-feedback Step 1A)."
          if [ "$GREEN" = "$TOTAL" ] && { [ "$VERDICT" = "LGTM" ] || [ "$VERDICT" = "COMMENTS" ]; }; then
            if [ "$HELD" != "no" ]; then
              ACTION="NOT cleared to merge: the do-not-auto-merge hold is set on this PR (or its labels could not be read). A human owns this one - leave it alone."
            elif [ "$MERGEABLE" = "false" ] || [ "$MERGE_STATE" = "dirty" ]; then
              ACTION="NOT cleared to merge: this PR has a merge conflict with ${BASE:-its base} (mergeable=${MERGEABLE}, mergeable_state=${MERGE_STATE}). Merge ${BASE:-the base} in, resolve the conflict, and let CI re-run first."
            elif [ "$MERGEABLE" != "true" ]; then
              ACTION="NOT cleared to merge yet: GitHub has not finished computing whether this PR conflicts with ${BASE:-its base} (mergeable=${MERGEABLE}). Re-check mergeability before merging; being behind ${BASE:-its base} is not itself a blocker."
            elif [ "$VERDICT" = "COMMENTS" ]; then
              ACTION="${FILE_FOLLOWUPS} Then you are cleared to squash merge (no merge conflict with ${BASE:-its base}; being behind it is not a blocker), delete the branch, clean any worktrees, and unsubscribe from webhooks."
            else
              ACTION="You are cleared to squash merge (no merge conflict with ${BASE:-its base}; being behind it is not a blocker), delete the branch, clean any worktrees, and unsubscribe from webhooks. Please proceed."
            fi
          elif [ "$VERDICT" = "COMMENTS" ]; then
            ACTION="${FILE_FOLLOWUPS} CI is not fully green yet - fix only the failing checks."
          elif [ "$VERDICT" = "UNPARSED" ]; then
            ACTION="NOT cleared to merge: comment ${ID} has no readable Verdict line. Surface it to a human; do not infer a verdict."
          else
            ACTION="pull comment ${ID} to see in-depth feedback and continue iterating"
          fi

          BODY=$(printf '%s\n%s\n%s\n%s\n' \
            "$MARKER" \
            "**CI**: ${GREEN}/${TOTAL} Green" \
            "**VERDICT**: ${VERDICT}" \
            "**Action**: ${ACTION}")
          gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY"
