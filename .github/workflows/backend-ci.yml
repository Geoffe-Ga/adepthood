name: Backend CI

on:
  # ``push`` is scoped to main. Without the branch filter it also fired on
  # every push to a PR branch, so each push started TWO identical ~18-minute
  # runs — one ``push``, one ``pull_request``, seconds apart (#2077). The main
  # entry is kept so merges still get a post-merge run.
  push:
    branches: [main]
    paths:
      - "backend/**"
      # The backend's own tooling lives outside backend/, so without this a PR
      # editing only a script here triggers nothing -- including the drift gate
      # that script IS. Caught in review of #2038: export_openapi.py sits at
      # scripts/backend/, so a change to render_spec or the --check exit logic
      # would have run neither openapi-drift nor the pytest job that covers it.
      - "scripts/backend/**"
      # The frontend Jest guards that read backend source run from this
      # workflow (see the cross-boundary-drift job). Their runner lives under
      # scripts/frontend/, which neither this workflow's backend/** path nor
      # frontend-ci.yml's frontend/** path covers, so without this line the
      # gate itself could be edited -- or disarmed -- while nothing ran.
      - "scripts/frontend/cross-boundary-drift.sh"
      - ".pre-commit-config.yaml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      # The backend's own tooling lives outside backend/, so without this a PR
      # editing only a script here triggers nothing -- including the drift gate
      # that script IS. Caught in review of #2038: export_openapi.py sits at
      # scripts/backend/, so a change to render_spec or the --check exit logic
      # would have run neither openapi-drift nor the pytest job that covers it.
      - "scripts/backend/**"
      # The frontend Jest guards that read backend source run from this
      # workflow (see the cross-boundary-drift job). Their runner lives under
      # scripts/frontend/, which neither this workflow's backend/** path nor
      # frontend-ci.yml's frontend/** path covers, so without this line the
      # gate itself could be edited -- or disarmed -- while nothing ran.
      - "scripts/frontend/cross-boundary-drift.sh"
      - ".pre-commit-config.yaml"
      - ".github/workflows/backend-ci.yml"

# One in-flight run per PR. A Ralph lane pushing a fix while CI is still
# grinding on the previous commit used to leave the stale run to burn to
# completion against a dead SHA. Cancellation is limited to pull_request:
# every push to main is a distinct merge whose run should stand on its own.
# Cancelled runs conclude as ``cancelled``, not ``success``, so
# iteration-trigger.yml's success gate cannot mis-fire on one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # Cache uv's download/build cache, keyed on the requirements files so
          # a dependency change busts it (audit-ci-05).
          enable-cache: true
          cache-dependency-glob: backend/requirements*.txt

      - name: Install backend deps
        run: |
          uv pip install --system -r backend/requirements-lock.txt
          uv pip install --system -r backend/requirements-dev.txt
          uv pip install --system pre-commit

      - name: Run pre-commit (Python hooks only)
        # ``no-commit-to-branch`` exists to block *local* commits to main;
        # in CI the push is already on main, so the hook is a false positive.
        env:
          SKIP: no-commit-to-branch
        run: |
          pre-commit run --hook-stage pre-commit --files $(git ls-files 'backend')

      - name: Run pre-push hooks (complexity + maintainability + tests)
        # backend-complexity/backend-tests-coverage moved to pre-push locally
        # to keep `git commit` fast. CI still runs them so nothing escapes
        # review.
        env:
          SKIP: no-commit-to-branch
        run: |
          pre-commit run --hook-stage pre-push --files $(git ls-files 'backend')

      - name: Docstring coverage (interrogate)
        working-directory: backend
        run: |
          interrogate -c pyproject.toml src/

      - name: Branch coverage ≥80%
        working-directory: backend
        run: |
          # Verify branch coverage meets the threshold by parsing coverage.xml.
          # Threshold starts at 80% (current baseline ~82%); tighten as test
          # coverage improves, especially in services/botmason.py (70%).
          #
          # The report is regenerated from the coverage data the pre-push-hook
          # step above already collected (backend-tests-coverage runs the whole
          # suite under --cov), rather than by running the suite a second time
          # in the same job. Staleness is not reachable here: the checkout is
          # fresh and both .coverage and coverage.xml are gitignored, so no
          # artifact can predate this job. A pytest crash (collection/import/
          # plugin error) fails the step that ran it, and coverage data that
          # never arrived fails the guard below - never a silent skip.
          # The --include filter reproduces the {src, scripts} file set that
          # step measured (verified identical: 190 files either way, and a
          # branch rate of 92.33% vs 92.44% - run-to-run jitter, against an
          # 80% gate).
          if [ ! -f .coverage ]; then
            echo "::error::.coverage not found - the test step collected no coverage data"
            exit 1
          fi
          coverage xml -o coverage.xml --include="src/*,scripts/*"
          python3 -c "
          import os, sys, xml.etree.ElementTree as ET
          if not os.path.exists('coverage.xml'):
              print('::error::coverage.xml not found — pytest produced no report')
              sys.exit(1)
          tree = ET.parse('coverage.xml')
          rate = float(tree.getroot().attrib['branch-rate']) * 100
          threshold = 80
          print(f'Branch coverage: {rate:.1f}% (threshold: {threshold}%)')
          if rate < threshold:
              print(f'::error::Branch coverage {rate:.1f}% is below {threshold}%')
              sys.exit(1)
          "

      - name: Security (pip-audit)
        run: |
          uv pip install --system pip-audit
          pip-audit -r backend/requirements.txt

  # Cross-version compatibility: verify tests pass on 3.11 and 3.13
  # (3.12 is already covered by the backend-quality job).
  backend-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # Cache uv's download/build cache, keyed on the requirements files so
          # a dependency change busts it (audit-ci-05).
          enable-cache: true
          cache-dependency-glob: backend/requirements*.txt
          cache-suffix: py${{ matrix.python-version }}

      - name: Install backend deps
        run: |
          uv pip install --system -r backend/requirements.txt
          uv pip install --system -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest -q --no-cov -n auto --dist loadfile

  openapi-drift:
    # Guards the committed backend/openapi.json against the app's real routes
    # and schemas. Same shape as migration-drift below: regenerate, then fail on
    # a diff. No database service -- the exporter points DATABASE_URL at an
    # in-memory SQLite because describing the app's shape must not require, or
    # touch, a real Postgres.
    #
    # The artifact is committed rather than generated on demand because it is
    # meant to be *reviewed*: a field disappearing from a response should show
    # up in a diff a human reads. This gate is what keeps it from going stale --
    # #522 deleted a generated types.ts precisely because nobody regenerated it.
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-do-not-use-in-prod  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements*.txt

      - name: Install backend deps
        run: uv pip install --system -r backend/requirements-lock.txt

      - name: Check the committed OpenAPI document is current
        run: python scripts/backend/export_openapi.py --check

  migration-drift:
    # BUG-INFRA-023: guard against models diverging from migrations.
    # Runs ``alembic upgrade head`` + ``alembic check`` on a throwaway
    # Postgres; fails if a developer added a model without generating
    # the matching migration, or if the downgrade path is broken
    # (BUG-INFRA-022 regression guard).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aptitude
          POSTGRES_PASSWORD: aptitude  # pragma: allowlist secret
          POSTGRES_DB: aptitude
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aptitude"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      # asyncpg requires ``postgresql+asyncpg`` and the alembic env normalises
      # either scheme, so any of the three forms would work here.
      DATABASE_URL: postgresql+asyncpg://aptitude:aptitude@localhost:5432/aptitude  # pragma: allowlist secret
      SECRET_KEY: ci-only-secret-do-not-use-in-prod  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # Cache uv's download/build cache, keyed on the requirements files so
          # a dependency change busts it (audit-ci-05).
          enable-cache: true
          cache-dependency-glob: backend/requirements*.txt

      - name: Install backend deps
        run: |
          uv pip install --system -r backend/requirements-lock.txt
          uv pip install --system -r backend/requirements-dev.txt

      - name: Upgrade, downgrade, re-upgrade (round-trip, branch 0)
        working-directory: backend
        run: |
          # ``alembic downgrade -1`` is ambiguous when the head is a merge
          # migration (``down_revision`` is a tuple of prior heads), so the
          # branch is resolved explicitly. ``--branch 0`` selects the first
          # parent — for ``c5ed9dd1dabc`` that's the ritual-03 head.
          alembic upgrade head
          prev=$(python -m scripts.resolve_prev_revision alembic.ini --branch 0)
          alembic downgrade "$prev"
          alembic upgrade head

      - name: Downgrade through merge-head branch 1, then re-upgrade
        working-directory: backend
        run: |
          # Same round-trip, but through the *other* parent of the merge
          # head. Without this step, an ``alembic downgrade`` bug along the
          # ritual-04 → soft-delete → chat-spend chain ships undetected.
          # The script exits 2 (and only 2) when branch 1 doesn't exist on
          # the current head; any other non-zero exit is an unexpected
          # failure and must propagate. This distinction is why stderr is
          # NOT swallowed — a real ImportError / file-not-found / decode
          # error here would otherwise be masked.
          alembic upgrade head
          set +e
          prev=$(python -m scripts.resolve_prev_revision alembic.ini --branch 1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            alembic downgrade "$prev"
            alembic upgrade head
          elif [ "$rc" -eq 2 ]; then
            echo "Head is not a merge migration; skipping branch-1 round-trip."
          else
            echo "::error::resolve_prev_revision failed with exit code $rc"
            exit "$rc"
          fi

      - name: Detect migration drift (models vs. migrations)
        working-directory: backend
        run: |
          # ``alembic check`` exits non-zero if autogenerate would produce
          # any operations — i.e. if a model was added/modified without a
          # matching migration.
          alembic check

      - name: Postgres advisory-lock regression (issue #274)
        working-directory: backend
        env:
          # Reuses this job's Postgres 16 service — the only CI job with a
          # live Postgres. The live-lock tests in this file skip everywhere
          # the variable is unset (local SQLite-only runs, other CI jobs).
          TEST_POSTGRES_URL: postgresql+asyncpg://aptitude:aptitude@localhost:5432/aptitude  # pragma: allowlist secret
        run: |
          # --no-cov: the repo-wide 90% coverage gate belongs to the
          # backend-quality job; this step only exercises the
          # pg_advisory_xact_lock branch that SQLite cannot.
          python -m pytest tests/test_pg_advisory_lock.py -q --no-cov

  backend-integration:
    # The default suite runs entirely on in-memory SQLite, where
    # ``backend/conftest.py`` rewrites Postgres ``ARRAY`` columns to ``JSON``
    # and hand-mirrors the functional / partial unique indexes under
    # ``..._test`` names. This lane runs the same FastAPI app against a real
    # Postgres whose schema comes from ``alembic upgrade head``, so array
    # semantics and index definitions are exercised as production has them
    # rather than as the fixture approximates them.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aptitude
          POSTGRES_PASSWORD: aptitude  # pragma: allowlist secret
          POSTGRES_DB: aptitude
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aptitude"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      # Deliberately no job-level DATABASE_URL, unlike migration-drift: the
      # lane's fixture creates a per-worker database, points alembic at it for
      # the duration of the upgrade, and restores the variable afterwards. A
      # job-level value would migrate the service's default database instead.
      TEST_POSTGRES_URL: postgresql+asyncpg://aptitude:aptitude@localhost:5432/aptitude  # pragma: allowlist secret
      # Turns "the service container never became healthy" from a green run
      # full of skips into a job failure.
      INTEGRATION_LANE_REQUIRE_POSTGRES: "1"
      SECRET_KEY: ci-only-secret-do-not-use-in-prod  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # Cache uv's download/build cache, keyed on the requirements files so
          # a dependency change busts it (audit-ci-05).
          enable-cache: true
          cache-dependency-glob: backend/requirements*.txt

      - name: Install backend deps
        run: |
          uv pip install --system -r backend/requirements-lock.txt
          uv pip install --system -r backend/requirements-dev.txt

      - name: Run the Postgres integration lane
        working-directory: backend
        run: |
          # Serial on purpose. The lane is a couple of dozen tests and each
          # extra worker pays for its own database creation plus a full
          # ``alembic upgrade head``, which costs more than the parallelism
          # buys back.
          #
          # --no-cov: the repo-wide 90% coverage gate belongs to the
          # backend-quality job, which measures the whole suite.
          python -m pytest tests/integration -m integration -q --no-cov

  cross-boundary-drift:
    # A handful of frontend Jest tests exist only to read backend source and
    # fail when the two stacks disagree: the ten APTITUDE colours and their
    # schedule, the upload cap, which consent sources something actually
    # writes, what the e2e launcher is allowed to stub.
    #
    # frontend-ci.yml is scoped to frontend/** on purpose -- ~450 Jest suites
    # plus the audit gate do not belong in a one-line backend change -- and
    # that had an unwritten consequence: a guard whose whole job is to watch
    # backend source never ran on a backend-only PR. A backend change giving a
    # consent source its first writer merged green and turned main red
    # afterwards, on an unrelated frontend PR.
    #
    # So the guards run here, where the breaking change is. Only the guards:
    # the runner discovers them by the marker each one carries, runs them by
    # path, and does not touch coverage, the bundler, or the audit gate. The
    # whole job is an npm ci and about a second of Jest. The narrowing over in
    # frontend-ci.yml stays exactly as it was.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Discovery is at run time, by import of frontend/src/testing/
      # backendSource.ts -- there is no path list here to go stale, and the
      # runner exits non-zero rather than reporting a clean empty sweep if it
      # ever finds nothing.
      - name: Run the frontend guards that read backend source
        run: ./scripts/frontend/cross-boundary-drift.sh

  content-drift:
    # Issue #397: the vendored backend/content/ must match its pinned
    # CONTENT_VERSION (no silent drift, no hand edits) and the manifest
    # must satisfy the frozen schema contract. Bootstrap state (nothing
    # vendored yet) passes — the gate arms itself with the first pin.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # Cache uv's download/build cache, keyed on the requirements files so
          # a dependency change busts it (audit-ci-05).
          enable-cache: true
          cache-dependency-glob: backend/requirements*.txt

      - name: Install drift-check deps
        # The check needs only the sync script's imports, not the app.
        run: uv pip install --system httpx 'jsonschema>=4.0'

      - name: Verify vendored content matches CONTENT_VERSION
        working-directory: backend
        run: python -m scripts.sync_content --check
