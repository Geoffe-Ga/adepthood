name: E2E

# The one job in this repository where the frontend and the backend meet. Both
# suites are exhaustive in isolation and neither can tell whether the wire
# between them is connected, so this lane drives the production API client --
# unmocked, over a real socket -- against the real app on a real Postgres.
#
# It watches both halves: a route renamed in the backend and a path edited in
# the client are equally capable of severing the seam, so either tree triggers
# the run.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/_affected.yml"
      - "scripts/ci/**"
      - "scripts/backend/**"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/_affected.yml"
      - "scripts/ci/**"
      - "scripts/backend/**"

# One in-flight run per PR, mirroring the sibling workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/_affected.yml

  # The bookkeeping gate. It needs no server and no database: it reads the
  # ledger in frontend/e2e/journeys.json and checks the claims in it are still
  # true of the tree -- every declared journey names a spec that exists and
  # still runs, every spec in the lane is declared, and every screen, client
  # wrapper, route and table a journey says it crosses is still there under
  # that name. Honest gaps (status: uncovered, with a linked issue) are counted
  # and reported, never failed on.
  #
  # It is a separate job from the lane below on purpose. A ledger that has gone
  # stale and a server that will not boot are different defects, and reading
  # them off one red X wastes the signal.
  journey-ledger:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit the journey coverage ledger
        working-directory: frontend
        run: npm run check:journeys

  e2e-journeys:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false') }}
    runs-on: ubuntu-latest
    # A slow gate gets skipped and a skipped gate is worse than none, so the
    # budget is explicit: the lane boots a server, migrates a schema and runs
    # every registered journey in well under a minute of work.
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aptitude
          POSTGRES_PASSWORD: aptitude # pragma: allowlist secret
          POSTGRES_DB: aptitude
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aptitude"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      # The lane creates and drops its own database beside this one; it never
      # writes to the database named here. An unset value is a hard failure in
      # globalSetup rather than a skip -- a lane that silently tests nothing is
      # the defect this whole job exists to remove.
      TEST_POSTGRES_URL: postgresql+asyncpg://aptitude:aptitude@localhost:5432/aptitude # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements*.txt

      - name: Install backend runtime deps
        # Runtime only: the launcher boots the app and runs alembic, neither of
        # which needs the dev toolchain.
        run: uv pip install --system -r backend/requirements-lock.txt

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run the journeys against a live backend
        working-directory: frontend
        env:
          E2E_PYTHON: python
        run: npm run test:e2e

  # Native textarea selection and accessibility semantics do not exist in the
  # Node journey process. This lane drives the production Expo web bundle in a
  # real Chromium process against the same real FastAPI/Postgres boundary.
  browser-journey:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false') }}
    runs-on: ubuntu-latest
    # 175 tests took 33.7 minutes on one worker (run 38637231314).
    # Shard by file across runners: ports, lane state files and the fake vault's
    # owner are shared within a checkout, so extra workers there are unsafe.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Keep the existing safety budget until sharded CI timings establish a new
    # bound. The former 35-minute cap cancelled a green suite during artifact
    # publication; individual Playwright test/action limits still apply.
    # The budget and artifact wiring are guarded by
    # backend/tests/scripts/test_browser_lane_artifact_uploads.py.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aptitude
          POSTGRES_PASSWORD: aptitude # pragma: allowlist secret
          POSTGRES_DB: aptitude
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aptitude"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://aptitude:aptitude@localhost:5432/aptitude # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements*.txt

      - name: Install backend runtime deps
        run: uv pip install --system -r backend/requirements-lock.txt

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install the browser runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the real-browser journey
        working-directory: frontend
        env:
          E2E_PYTHON: python
        run: npm run test:e2e:web -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload browser timing report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-journey-report-${{ matrix.shard }}
          path: frontend/playwright-report/results.json
          if-no-files-found: warn
          retention-days: 14

      # playwright.config.ts retains a trace for every failed test. Without this
      # step those traces die with the runner, and a layout failure that does not
      # reproduce on a developer's Chromium build cannot be diagnosed at all.
      - name: Upload failed-test traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-journey-test-results-${{ matrix.shard }}
          path: frontend/test-results
          if-no-files-found: warn
          retention-days: 14

      # The text census (#2948) is the point of a green run as much as of a red
      # one: the per-route screenshots and JSON under e2e/artifacts/text-order
      # are what the epic's review step reads, so they are published whatever
      # the verdict, separately from the failure-only traces above.
      # Each sweep is one test in one file, so only its owning shard has files
      # to upload. Keep the review artifact names stable; no other shard writes
      # either folder, even when that shard fails. Do not split files across workers.
      - name: Upload the text census
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: text-order-census
          path: frontend/e2e/artifacts/text-order/**
          if-no-files-found: warn
          retention-days: 14

      # The action-row sweep (#2860) likewise: its screenshots and button tables
      # under e2e/artifacts/action-rows are the review step's input, and a green
      # run -- geometry held -- is exactly the one a reviewer reads against the
      # DESIGN.md "Action rows" rules. Guarded by
      # backend/tests/scripts/test_browser_lane_artifact_uploads.py.
      - name: Upload the action-row sweep
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-row-sweep
          path: frontend/e2e/artifacts/action-rows/**
          if-no-files-found: warn
          retention-days: 14
