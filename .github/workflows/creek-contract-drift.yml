name: Creek contract drift

# Ask Creek, once a week, whether it still publishes the /v1 contract bytes this
# repo vendored under backend/tests/fixtures/creek_v1/. The conformance suite
# reads every wire shape it asserts out of that vendored copy, so upstream can
# move without a single test going red -- the copy silently stops describing the
# server and the divergence surfaces in production instead of in review. This
# job is the only thing that looks.
#
# Scheduled and manual only, deliberately: no push and no pull_request trigger.
# A PR check that reached out to the live network would make every build depend
# on a third party's availability, would let a PR author's branch decide what
# gets fetched, and would turn an upstream outage into a merge blocker. The
# offline half of the same script (`verify`) runs in the normal test suite on
# every PR, and that is where the fast feedback belongs.
#
# creek-vault is a public repository, so the raw fetch is unauthenticated and
# this workflow references no secret at all. There is nothing here for a
# compromised step to exfiltrate.
#
# Exit 1 (drift) and exit 2 (could not verify) both fail the job, and neither is
# swallowed. Exit 2 is not a softer outcome than exit 1: a run that could not
# reach Creek, or that was served something it refused to parse, has proven
# nothing about the pin. Letting it pass would turn this gate into a weekly
# green checkmark that means "nobody looked".

on:
  schedule:
    # Saturdays 08:30 UTC -- the weekday 08:00 slots are taken by the scan
    # workflows, and a weekend run leaves the whole week to act on a finding.
    - cron: "30 8 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creek-contract-drift
  cancel-in-progress: false

jobs:
  compare-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the drift check's only dependency
        # The check imports httpx and nothing else from the app, so installing
        # the whole backend requirement set would only widen the surface of a
        # job that talks to the network. The version comes from the repo's own
        # pins as a constraint rather than being restated here, so this job can
        # never quietly fetch with a different httpx than the app ships.
        #
        # The extras are stripped first because pip refuses a constraints file
        # containing any ("Constraints cannot have extras"), and one pin grew a
        # set. Stripping rather than dropping the offending lines: a constraint
        # file's whole job is to bound versions, extras say nothing about a
        # version, and a filter that removed lines would quietly unpin whatever
        # it removed.
        run: |
          sed -E 's/\[[^]]*\]//' backend/requirements.txt > /tmp/creek-drift-constraints.txt
          pip install -c /tmp/creek-drift-constraints.txt httpx

      - name: Compare the vendored bundle against what Creek publishes today
        working-directory: backend
        # The exit code carries three distinct answers and the run list shows
        # one colour, so the summary is where the distinction has to survive.
        # $? is inspected explicitly rather than left to `set -e`: exit 1 means
        # the vendored bundle no longer describes what Creek serves, exit 2
        # means the comparison could not be made at all, and collapsing them
        # would turn "we could not look" into "we looked and it drifted". Both
        # still fail the job -- exit 2 is not the softer outcome, it is the one
        # that has proven nothing.
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/creek-drift.txt"
          python -m scripts.creek_contract_drift compare 2>&1 | tee "$report"
          status=${PIPESTATUS[0]}
          case "$status" in
            0) verdict="Ran clean: Creek still publishes the /v1 bytes this repo vendored." ;;
            1) verdict="**Drift found.** The vendored bundle under backend/tests/fixtures/creek_v1/ no longer describes what Creek serves, so the conformance suite is asserting against a copy that has stopped being true. Re-vendor it." ;;
            *) verdict="**Could not verify.** Creek was unreachable, or answered with something this check refused to parse. Nothing was proven about the pin either way -- do not read this as clean." ;;
          esac
          {
            echo "## Creek contract drift"
            echo
            echo "$verdict"
            echo
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  report-failure:
    name: Report the failure so it is not silent
    needs: compare-upstream
    if: failure()
    # Both substantive exits fail this job -- drift found, and could-not-verify
    # -- and both must reach a human. A weekly check whose failures scroll away
    # is the green checkmark meaning nobody looked that the header above
    # refuses to become.
    #
    # Job-level, deliberately. A job `permissions:` block REPLACES the file's,
    # so this grants the reporter exactly what it needs without widening any
    # other job in this workflow.
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/_report-failure.yml
    with:
      workflow-file: creek-contract-drift.yml
      labels: bug,infra
