name: Report a workflow failure (reusable)

# One failure path for every scheduled workflow in this repo.
#
# WHY THIS IS SHARED: a scheduled run reaches nobody. There is no PR to
# annotate, no author waiting on a check, and nothing to click through from --
# the whole audience is the Actions run list, which shows one word per run. The
# graph-semantic workflow failed every week for over a month while CLAUDE.md was
# telling every agent to prefer the knowledge graph over grep sweeps, and the
# only thing that eventually noticed was a hand-rolled reporting job in that one
# file. Of six actively scheduled workflows, exactly one could say it had
# failed. This is that job, lifted out so the other five say it too, and so
# there is ONE failure path to maintain rather than six that drift.
#
# It opens or UPDATES a single tracking issue per workflow, keyed on a marker in
# the issue body. A bot that files weekly is noise, and noise is how the
# original failures went unread.

on:
  workflow_call:
    inputs:
      workflow-file:
        description: >-
          The CALLER's bare workflow filename, e.g. "scan-groom.yml". It keys
          the tracking issue's marker, so it must be stable and must not be
          derived from github.workflow_ref -- that resolves to
          owner/repo/.github/workflows/x.yml@ref, and a marker built from it
          would change with the ref and file a fresh issue per branch.
        required: true
        type: string
      headline:
        description: >-
          One line naming WHICH failure mode occurred, when the caller
          classified it. Leads the issue body and the repeat-failure comment.
        required: false
        type: string
        default: ""
      labels:
        description: "Comma-separated labels for the tracking issue, applied on creation only."
        required: false
        type: string
        default: "bug,infra"

# TOP LEVEL, not job level, and load-bearing: GitHub compares a called
# workflow's declared permissions against the caller's before it schedules
# anything, and rejects the pair outright when the caller grants less -- the run
# ends as startup_failure with zero jobs and no log. backend/tests/
# test_workflow_permissions.py reads exactly this block to catch that pairing
# before it ships, so declaring these scopes anywhere else would validate
# nothing.
permissions:
  contents: read   # checkout, for the reporter script itself
  issues: write    # open or comment on the one tracking issue
  actions: read    # read the caller's run: its log archive, and its jobs

jobs:
  report:
    name: Open or update the tracking issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # No step git-pushes here, so the token never needs to live in
        # .git/config for the job.
        with:
          persist-credentials: false

      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Every input arrives through the environment, never spliced into the
          # script text. The headline in particular can originate in model
          # output, and an inline expression is evaluated by Actions BEFORE bash
          # sees the line -- which makes any interpolated model output a shell
          # injection.
          WORKFLOW_FILE: ${{ inputs.workflow-file }}
          HEADLINE: ${{ inputs.headline }}
          LABELS: ${{ inputs.labels }}
        run: |
          set -uo pipefail
          # github.run_id inside a called reusable workflow is the CALLER's run,
          # so this fetches the log of the thing that actually failed.
          #
          # An unreadable log must still produce a report: the run failed, and
          # that fact reaching a human matters more than the detail attached to
          # it. So every fetch below is LOUD, never fatal -- and never silent
          # either. The previous line ended `2>/dev/null || : > "$log"`, which
          # discarded stderr, the exit code, and the difference between "the log
          # was read and held nothing" and "the log was never fetched at all".
          #
          # That mattered on EVERY invocation rather than rarely: this job runs
          # inside the still-in-progress run it is reporting on, and the
          # run-level log archive is not published until the whole run finishes.
          # So the archive fetch 404s every time, and every tracking issue this
          # reporter has ever filed said "(no failure log was readable for this
          # run)" about a log that was perfectly readable a minute later.
          #
          # `-e` is inherited from GitHub's `bash -e {0}` -- `set -uo pipefail`
          # adds options rather than replacing them -- and is cleared here so
          # that a failing fetch reaches the branch that handles it instead of
          # killing the step.
          log="$RUNNER_TEMP/log-failed.txt"
          fetch_error="$RUNNER_TEMP/log-fetch-error.txt"
          # The prefix the runner puts on a failure line. Filtering the per-job
          # log to these is what keeps the fallback's excerpt on the failure
          # rather than on the setup steps that scroll above it.
          error_marker='##[error]'

          set +e
          gh run view "$GITHUB_RUN_ID" --log-failed > "$log" 2> "$fetch_error"
          fetch_status=$?

          if [ "$fetch_status" -ne 0 ]; then
            : > "$log"
            # A JOB's log is published as soon as that job ends, which is before
            # this one starts -- so the log the archive cannot yet serve is
            # reachable one endpoint over. `GITHUB_REPOSITORY` is always set by
            # Actions; the guard is what lets a test drive both halves of this
            # branch, and what keeps a hand-run of the block off the API.
            repo="${GITHUB_REPOSITORY:-}"
            if [ -n "$repo" ]; then
              failed_jobs="$RUNNER_TEMP/failed-jobs.tsv"
              # --paginate, because this endpoint serves 30 jobs a page by
              # default and a matrix run has more than that -- an unpaginated
              # read would drop the failing job on exactly the biggest runs.
              gh api --paginate \
                "repos/$repo/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
                --jq '.jobs[] | select(.conclusion == "failure")
                      | [.id, .name,
                         ([.steps[]? | select(.conclusion == "failure") | .name]
                          | first // "(failing step not reported)")]
                      | @tsv' > "$failed_jobs" 2>> "$fetch_error"
              jobs_status=$?
              if [ "$jobs_status" -eq 0 ]; then
                # Rebuilt in the TAB-separated `<job>\t<step>\t<message>` shape
                # `gh run view --log-failed` emits, because that is what
                # report_workflow_failure.sh parses.
                while IFS=$'\t' read -r job_id job_name step_name; do
                  [ -n "$job_id" ] || continue
                  gh api "repos/$repo/actions/jobs/$job_id/logs" 2>> "$fetch_error" \
                    | grep -F "$error_marker" \
                    | awk -v job="$job_name" -v step="$step_name" \
                        '{ printf "%s\t%s\t%s\n", job, step, $0 }' >> "$log"
                done < "$failed_jobs"
              fi
            fi

            # One line, because the reporter reads this file as one record per
            # line and a raw multi-line gh error would arrive as several
            # unparseable ones.
            reason="$(tr '\n\t' '  ' < "$fetch_error" | sed -e 's/  */ /g' -e 's/^ //' -e 's/ $//')"
            # WHICH ANNOTATION depends on what the fallback came back with, not
            # on whether the archive fetch failed -- the archive fetch fails on
            # every single invocation, so a warning keyed on that alone would
            # say "the log could not be fetched" directly beside a log that was.
            # An annotation that is wrong on the ordinary path is one nobody
            # reads on the extraordinary one.
            if [ -s "$log" ]; then
              echo "::notice::the run-level log archive is not published until the run ends (gh exited $fetch_status: $reason), so the failure log below was read from the per-job API instead"
            else
              echo "::warning::the failure log could not be fetched (gh exited $fetch_status): $reason"
              printf '%s\t%s\t%s\n' \
                "$WORKFLOW_FILE" \
                "(unavailable: the log could not be fetched)" \
                "The failure log was not yet available while the run was in progress, and the per-job fallback could not read it either. gh exited $fetch_status: $reason. The log itself is very likely readable now at the run URL above -- this says nothing about what the run printed." \
                > "$log"
            fi
          fi
          set -e

          args=(--workflow "$WORKFLOW_FILE" --run-url "$RUN_URL" --log-file "$log")
          if [ -n "$HEADLINE" ]; then
            args+=(--headline "$HEADLINE")
          fi
          # Labels are applied on creation only; the reporter falls back to an
          # unlabelled create if the repo lacks one, because the marker -- not
          # the label -- is what makes the issue findable again.
          IFS=',' read -r -a wanted <<< "$LABELS"
          # The `[@]+` guard is not decoration: an empty labels input yields an
          # empty array, and `"${wanted[@]}"` on one is an unbound-variable
          # error under `set -u` on bash 3.2 -- which is what a maintainer
          # hand-running this block on a Mac has.
          for label in ${wanted[@]+"${wanted[@]}"}; do
            if [ -n "$label" ]; then
              args+=(--label "$label")
            fi
          done

          bash scripts/graph/report_workflow_failure.sh "${args[@]}"
