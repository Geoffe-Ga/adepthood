version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # Batch low-risk patch + minor bumps into a single PR per ecosystem so the
    # Dependabot → Ralph bridge files one issue per batch instead of one per
    # dependency. Major bumps stay individual (separate PRs) so they get
    # focused review — they may carry breaking changes Ralph must adapt to.
    groups:
      pip-patch-minor:
        update-types:
          - "patch"
          - "minor"
    # Grouped batches can exceed the default cap; raise the limit so a weekly
    # batch plus outstanding majors are never throttled.
    open-pull-requests-limit: 15

  - package-ecosystem: "pip"
    directory: "/scripts/graph"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # scripts/graph pins a single build tool (graphifyy). Batch its patch +
    # minor bumps like the backend entry so the Dependabot → Ralph bridge files
    # one issue per batch; a major bump stays individual for focused review.
    groups:
      graph-patch-minor:
        update-types:
          - "patch"
          - "minor"
    open-pull-requests-limit: 15

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # Batch patch + minor into one PR per run; majors stay individual.
    groups:
      npm-patch-minor:
        update-types:
          - "patch"
          - "minor"
    open-pull-requests-limit: 15
    ignore:
      # react-native-web 0.21.2 still declares styleq ^0.1.3; the 0.2.x line
      # targets a later RNW. This one outlived the SDK 52 era -- the blocker is
      # the pinned RNW major, not the Expo SDK. Unpin when RNW moves past 0.21.
      - dependency-name: "styleq"
        versions: [">=0.2.0"]
      # @testing-library/react-native 14.x has engines Node ^22.13; frontend CI
      # runs Node 20 (frontend/.nvmrc). Its React 19 / RN >=0.78 requirements are
      # satisfied now -- Node is the only thing left. Unpin with the CI Node 22
      # move, alongside the @babel/core entry below.
      - dependency-name: "@testing-library/react-native"
        versions: [">=14.0.0"]
      # Jest 30 needs jest-environment-node / babel-jest ^30, but
      # @react-native/jest-preset 0.86.2 -- the preset jest.config.js uses --
      # depends on both at ^29.7.0. Jest moves with the RN tooling, not on its
      # own; unpin when the RN preset adopts the jest-30 line.
      - dependency-name: "jest"
        versions: [">=30.0.0"]
      # @types/jest must match the jest major; it pairs with jest 30 and moves
      # with it -- see the jest entry above.
      - dependency-name: "@types/jest"
        versions: [">=30.0.0"]
      # TypeScript 7 is the native-port line; adopt it via a deliberate
      # migration, not a Dependabot bump. The floor was ">=6.0.0" until the SDK
      # 57 chain adopted 6.0.3 -- which silently turned this rule from "hold 6
      # back" into "freeze the 6.x we are on", suppressing every 6.x patch.
      # backend/tests/test_dependabot_ignores.py now fails when a floor drops to
      # or below the installed version. Unpin when the toolchain supports 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # @babel/core 8.x engines require Node ^22.18 || >=24.11; frontend CI is
      # pinned to Node 20 (.nvmrc). Unpin when CI Node moves to 22+.
      - dependency-name: "@babel/core"
        versions: [">=8.0.0"]
      # eslint-plugin-import + eslint-plugin-react cap their eslint peer at ^9
      # and have no eslint-10 release; adopting eslint 10 ERESOLVE-fails. Unpin
      # when both plugins ship eslint-10 support (or after an import-x /
      # react-plugin migration).
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      # eslint-plugin-unicorn 65.x requires eslint >=10.4 and Node >=22, neither
      # of which we run (eslint is pinned <10 above; CI Node is 20). Unpin with
      # the ESLint-10 / Node-22 migration -- see the eslint entry above.
      - dependency-name: "eslint-plugin-unicorn"
        versions: [">=65.0.0"]
      # react-native-worklets is not independently upgradable: Expo SDK 57 pins
      # 0.10.1, and react-native-reanimated 4.5.1 declares a peer of "0.10.x".
      # The 0.11.3 bump ERESOLVE-failed frontend CI for exactly that reason. It
      # moves with the SDK via `expo install`, not on its own.
      #
      # The floor was ">=0.11.0", which stated that intent without enforcing
      # it: the whole 0.10.x line stayed proposable, so grouped bumps ratcheted
      # the pin to 0.10.3 and then 0.10.4 while `expo install --check` kept
      # expecting 0.10.1. reanimated's "0.10.x" peer is wide enough that npm
      # never objected, so nothing failed -- the tree just quietly diverged
      # from the SDK. A floor one patch above the expected version holds the
      # whole line, which is what "moves with the SDK" requires. Raise it in
      # step with whatever the next Expo SDK expects.
      - dependency-name: "react-native-worklets"
        versions: [">=0.10.2"]
      # @react-native/jest-preset is pinned by react-native, not chosen by us:
      # react-native 0.86.2 declares peerOptional @react-native/jest-preset at
      # the *exact* version "0.86.2", not a range. The 0.87.0 bump therefore had
      # no satisfiable resolution and `npm ci` died with ERESOLVE before a
      # single test ran, taking frontend-quality and e2e-journeys down with it.
      # The preset moves only when react-native moves, which under Expo SDK 57
      # means when the SDK moves. Unpin when react-native leaves the 0.86 line.
      - dependency-name: "@react-native/jest-preset"
        versions: [">=0.87.0"]
      # Expo SDK 57 expects async-storage 2.2.0; `expo install --check` on the
      # 3.1.1 bump reports "may not work correctly until you install the
      # expected versions". Nothing in the suite would catch it -- jest.config
      # maps this package to src/__mocks__/async-storage.js, so all 450 suites
      # pass against the mock no matter what the real module does. It moves
      # with the SDK. Unpin when an Expo SDK expects the 3.x line.
      - dependency-name: "@react-native-async-storage/async-storage"
        versions: [">=3.0.0"]
      # react-native-screens moves with the SDK, not on its own: Expo SDK 57
      # expects the RANGE "~4.26.0" and the tree had drifted a whole minor ahead
      # to 4.27.x, which `expo install --check` reports and nothing else does.
      # The floor therefore sits at the next MINOR rather than the next patch --
      # ">=4.27.0" keeps every 4.26.x patch proposable while holding the entire
      # 4.27 line, which is what "expects a range" requires.
      #
      # Nothing is being held back for safety and nothing skipped carries a
      # security fix. Read from the upstream release notes on 2026-08-28
      # (github.com/software-mansion/react-native-screens/releases, tag 4.27.0)
      # and cross-checked against `npm audit`, which does not list this package:
      # 4.27.0's headline content is React Native 0.87 support
      # plus Android crash guards, and this repo does not run RN 0.87 --
      # react-native is on the 0.86 line, which is why
      # @react-native/jest-preset is floored at ">=0.87.0" above for exactly the
      # same reason. What is NOT verified here: there is no frontend/ios or
      # frontend/android directory, so the native behaviour of the step-back is
      # uncompiled and untested in this repo. Raise the floor in step with
      # whatever the next Expo SDK expects.
      - dependency-name: "react-native-screens"
        versions: [">=4.27.0"]
      # react-native-svg is pinned by Expo SDK 57 EXACTLY -- "15.15.4", no
      # tilde -- so like react-native-worklets above the floor sits one patch
      # above the expected version, because a floor at the next minor would let
      # a grouped patch bump ratchet the pin past the compatibility table with
      # nothing objecting. The tree had drifted to 15.15.5; the realignment
      # stepped it back.
      #
      # Nothing skipped carries a security fix. Read from the upstream release
      # notes on 2026-08-28 (github.com/software-mansion/react-native-svg/
      # releases, tags v15.15.3 through v15.15.5) and cross-checked against
      # `npm audit`, which does not list this package: 15.15.5 is cross-platform
      # minor fixes plus CI and publishing changes, and the use-after-free fix
      # this package is remembered for landed in 15.15.3 -- below the
      # step-back, so it is retained. What is NOT verified here: there is no frontend/ios or
      # frontend/android directory, so the native behaviour of the step-back is
      # uncompiled and untested in this repo. Jest renders this package for
      # real rather than through a mock, which covers its JS surface and
      # nothing below it. Raise the floor in step with whatever the next Expo
      # SDK expects.
      - dependency-name: "react-native-svg"
        versions: [">=15.15.5"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    # Batch patch + minor action bumps; majors stay individual.
    groups:
      actions-patch-minor:
        update-types:
          - "patch"
          - "minor"
    open-pull-requests-limit: 15
