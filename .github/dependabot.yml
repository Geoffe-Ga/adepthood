version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # Batch low-risk patch + minor bumps into a single PR per ecosystem so the
    # Dependabot → Ralph bridge files one issue per batch instead of one per
    # dependency. Major bumps stay individual (separate PRs) so they get
    # focused review — they may carry breaking changes Ralph must adapt to.
    groups:
      pip-patch-minor:
        update-types:
          - "patch"
          - "minor"
    # Grouped batches can exceed the default cap; raise the limit so a weekly
    # batch plus outstanding majors are never throttled.
    open-pull-requests-limit: 15

  - package-ecosystem: "pip"
    directory: "/scripts/graph"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # scripts/graph pins a single build tool (graphifyy). Batch its patch +
    # minor bumps like the backend entry so the Dependabot → Ralph bridge files
    # one issue per batch; a major bump stays individual for focused review.
    groups:
      graph-patch-minor:
        update-types:
          - "patch"
          - "minor"
    open-pull-requests-limit: 15

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # Batch patch + minor into one PR per run; majors stay individual.
    groups:
      npm-patch-minor:
        update-types:
          - "patch"
          - "minor"
    open-pull-requests-limit: 15
    ignore:
      # react-native-web 0.21.2 still declares styleq ^0.1.3; the 0.2.x line
      # targets a later RNW. This one outlived the SDK 52 era -- the blocker is
      # the pinned RNW major, not the Expo SDK. Unpin when RNW moves past 0.21.
      - dependency-name: "styleq"
        versions: [">=0.2.0"]
      # @testing-library/react-native 14.x has engines Node ^22.13; frontend CI
      # runs Node 20 (frontend/.nvmrc). Its React 19 / RN >=0.78 requirements are
      # satisfied now -- Node is the only thing left. Unpin with the CI Node 22
      # move, alongside the @babel/core entry below.
      - dependency-name: "@testing-library/react-native"
        versions: [">=14.0.0"]
      # Jest 30 needs jest-environment-node / babel-jest ^30, but
      # @react-native/jest-preset 0.86.2 -- the preset jest.config.js uses --
      # depends on both at ^29.7.0. Jest moves with the RN tooling, not on its
      # own; unpin when the RN preset adopts the jest-30 line.
      - dependency-name: "jest"
        versions: [">=30.0.0"]
      # @types/jest must match the jest major; it pairs with jest 30 and moves
      # with it -- see the jest entry above.
      - dependency-name: "@types/jest"
        versions: [">=30.0.0"]
      # TypeScript 7 is the native-port line; adopt it via a deliberate
      # migration, not a Dependabot bump. The floor was ">=6.0.0" until the SDK
      # 57 chain adopted 6.0.3 -- which silently turned this rule from "hold 6
      # back" into "freeze the 6.x we are on", suppressing every 6.x patch.
      # backend/tests/test_dependabot_ignores.py now fails when a floor drops to
      # or below the installed version. Unpin when the toolchain supports 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # @babel/core 8.x engines require Node ^22.18 || >=24.11; frontend CI is
      # pinned to Node 20 (.nvmrc). Unpin when CI Node moves to 22+.
      - dependency-name: "@babel/core"
        versions: [">=8.0.0"]
      # eslint-plugin-import + eslint-plugin-react cap their eslint peer at ^9
      # and have no eslint-10 release; adopting eslint 10 ERESOLVE-fails. Unpin
      # when both plugins ship eslint-10 support (or after an import-x /
      # react-plugin migration).
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      # eslint-plugin-unicorn 65.x requires eslint >=10.4 and Node >=22, neither
      # of which we run (eslint is pinned <10 above; CI Node is 20). Unpin with
      # the ESLint-10 / Node-22 migration -- see the eslint entry above.
      - dependency-name: "eslint-plugin-unicorn"
        versions: [">=65.0.0"]
      # react-native-worklets is not independently upgradable: Expo SDK 57 pins
      # 0.10.1 (`expo install --check` reports the tree up to date at it), and
      # react-native-reanimated 4.5.1 declares a peer of "0.10.x". The 0.11.3
      # bump ERESOLVE-failed frontend CI for exactly that reason. It moves with
      # the SDK via `expo install`, not on its own. Unpin when a reanimated
      # release widens that peer range.
      - dependency-name: "react-native-worklets"
        versions: [">=0.11.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    # Batch patch + minor action bumps; majors stay individual.
    groups:
      actions-patch-minor:
        update-types:
          - "patch"
          - "minor"
    open-pull-requests-limit: 15
