server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Security headers — mitigate clickjacking, MIME-sniffing, and info leakage
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content-Security-Policy: ENFORCED (ADR 0009 phase (b), first slice). The
    # identical policy is repeated in every location below that sets its own
    # add_header, because nginx does not inherit server-level add_header into
    # such a block. Directive by directive:
    #   script-src 'self'  The Expo export ships no inline script and no eval
    #                      (zod's JIT probe is switched off in src/zodJitless.ts),
    #                      and web-hardening/sri.js pins every bundle by hash. Never
    #                      add 'unsafe-inline', 'unsafe-eval' or a host here.
    #   style-src 'unsafe-inline'  ACCEPTED RISK, unchanged from report-only:
    #                      react-native-web injects its styles as <style> text
    #                      at runtime, and the export's own reset is inline.
    #   img-src https: data:  Course chapters render Markdown images from any
    #                      https host and meditation cards take a pasted image
    #                      URL; picked photos arrive as data: URIs. This is the
    #                      one fetch directive still open to every https host.
    #   media-src data:    The practice bells are synthesised as data: WAVs
    #                      (src/features/Practice/engine/adapters/bellSynth.ts).
    #   connect-src        Narrowed from "'self' https:". web-hardening/csp.js
    #                      replaces its build-time placeholder (the token after
    #                      'self' in the policy) with the API origin from EXPO_PUBLIC_API_BASE_URL (and the
    #                      Sentry ingest origin when EXPO_PUBLIC_SENTRY_DSN is
    #                      set). Left unrendered, a browser drops the token as an
    #                      invalid source, so the API is refused: it fails closed.
    #                      api.openai.com and api.anthropic.com are listed for
    #                      phase (a)'s client-direct BYOK calls.
    #   object-src 'none'; base-uri 'none'; form-action 'self'  Tightened when
    #                      the policy was enforced: the app embeds no plugins,
    #                      sets no <base> and posts no HTML forms.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; media-src 'self' data:; connect-src 'self' __BUILD_CONNECT_ORIGINS__ https://api.openai.com https://api.anthropic.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # Return a real 404 for non-SPA vulnerability-scanner probe paths instead
    # of letting the SPA catch-all serve index.html with 200. Regex locations
    # take precedence over the prefix "location /" catch-all below; among regex
    # blocks the first match in file order wins, so keep these ahead of it.
    location ~* ^/(wp-content|wp-admin|wp-includes) {
        return 404;
    }

    location ~* \.php$ {
        return 404;
    }

    # Exact build provenance stays fresh. An absent file returns nginx's real
    # static 404; it never enters the SPA fallback below. A location with its
    # own add_header must repeat all security headers rather than inherit them.
    location = /build-receipt.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; media-src 'self' data:; connect-src 'self' __BUILD_CONNECT_ORIGINS__ https://api.openai.com https://api.anthropic.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # SPA fallback: serve index.html for all routes that don't match a file
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (fingerprinted by Expo build)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; media-src 'self' data:; connect-src 'self' __BUILD_CONNECT_ORIGINS__ https://api.openai.com https://api.anthropic.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Don't cache index.html so new deploys take effect immediately
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; media-src 'self' data:; connect-src 'self' __BUILD_CONNECT_ORIGINS__ https://api.openai.com https://api.anthropic.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Gzip text-based assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
